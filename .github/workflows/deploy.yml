name: CI/CD

# Pull requests → run checks only.
# Push to main or test → run checks, then deploy that branch to the server over SSH.
on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

# Never let two deploys run at once; cancel an in-progress run if a newer push lands.
concurrency:
  # One group for both branches: they deploy to the same server, so never run two deploys at once.
  group: ${{ github.event_name == 'push' && 'cicd-deploy' || format('cicd-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests (non-blocking)
        working-directory: frontend
        run: npm run test
        continue-on-error: true

      - name: Production build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, redis, gd, zip, bcmath, exif, pcntl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: PHPUnit (sqlite in-memory)
        working-directory: backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

  deploy:
    name: Deploy to server
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    # Only deploy real pushes to main or test — never on pull requests.
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test') && github.event_name == 'push'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "▶ Deploying in: $(pwd)"
            # Guard against git 'detected dubious ownership' when the dir is owned
            # by another user (e.g. www-data) than the SSH login user.
            git config --global --add safe.directory "$(pwd)" || true
            # Prove this is the repo that actually serves the site before building.
            echo "▶ Remote: $(git remote get-url origin 2>/dev/null || echo 'NOT A GIT REPO')"
            # Check out the pushed branch first so its own deploy.sh is the one that runs.
            BRANCH="${{ github.ref_name }}"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            DEPLOY_BRANCH="$BRANCH" bash ./deploy.sh
